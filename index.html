<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Finance Tracker Pro</title>
    
    <!-- Load React & Libraries from CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/recharts/umd/Recharts.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&family=Noto+Sans+Thai:wght@400;600&display=swap');
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; padding: 0; background: #020817; color: #e2e8f0; overflow-x: hidden; }
        
        input[type=number]::-webkit-outer-spin-button, 
        input[type=number]::-webkit-inner-spin-button { -webkit-appearance:none; margin: 0; }
        
        .tab-btn { transition: all 0.2s; cursor:pointer; border:none; }
        .tab-btn:active { transform: scale(0.95); }
        .action-btn:hover { opacity:0.8; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width:4px; }
        ::-webkit-scrollbar-track { background:#0f172a; }
        ::-webkit-scrollbar-thumb { background:#334155; border-radius:10px; }

        @media (max-width: 768px) {
            .grid-mobile { grid-template-columns: 1fr !important; }
            .kpi-container { flex-direction: row; overflow-x: auto; white-space: nowrap; }
            .kpi-card { min-width: 160px; border-right: 1px solid #1e293b !important; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useCallback, useEffect } = React;
        const { PieChart, Pie, Cell, Tooltip, Legend, ResponsiveContainer } = Recharts;

        // --- Configuration & Constants ---
        const THAI_MONTHS = ["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
        const EN_MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
        const YEARS = Array.from({length:6},(_,i)=> new Date().getFullYear() - 2 + i);

        const INCOME_CATS = [
            { id:"salary",   label:"เงินเดือน", icon:"💵", color:"#10b981" },
            { id:"license",  label:"ค่าใบประกอบ", icon:"📋", color:"#34d399" },
            { id:"shortage", label:"ค่าขาดแคลน", icon:"🏥", color:"#6ee7b7" },
            { id:"ot",       label:"ค่าเวร", icon:"⏰", color:"#a7f3d0" },
            { id:"special",  label:"ค่าตรวจพิเศษ", icon:"🔬", color:"#059669" },
            { id:"other_in", label:"รายได้อื่น", icon:"💰", color:"#047857" },
        ];

        const EXPENSE_CATS = [
            { id:"social",   label:"ประกันสังคม", icon:"🛡️", color:"#ef4444" },
            { id:"provident",label:"กองทุนสมทบ", icon:"#f97316", color:"#f97316" },
            { id:"savings",  label:"เงินเก็บ (25%)", icon:"🏦", color:"#eab308" },
            { id:"room",     label:"ค่าห้อง/น้ำไฟ", icon:"🏠", color:"#84cc16" },
            { id:"food",     label:"ค่าอาหาร", icon:"🍚", color:"#06b6d4" },
            { id:"fuel",     label:"ค่าน้ำมัน", icon:"⛽", color:"#3b82f6" },
            { id:"shopping", label:"ช้อปปิ้ง", icon:"🛍️", color:"#8b5cf6" },
            { id:"cat",      label:"ค่าแมว", icon:"🐱", color:"#ec4899" },
            { id:"phone",    label:"ค่าโทรศัพท์", icon:"📱", color:"#14b8a6" },
            { id:"etf",      label:"ซื้อ ETF", icon:"📈", color:"#f59e0b" },
            { id:"coop",     label:"สหกรณ์", icon:"🤝", color:"#6366f1" },
            { id:"travel",   label:"เก็บไปเที่ยว", icon:"✈️", color:"#0ea5e9" },
            { id:"credit",   label:"ตัดบัตรเครดิต", icon:"💳", color:"#dc2626" },
            { id:"car",      label:"ผ่อนรถ", icon:"🚗", color:"#7c3aed" },
            { id:"other_ex", label:"รายจ่ายอื่น", icon:"📌", color:"#9ca3af" },
        ];

        const SEED_DATA = {
            "2025-9": { income:{ salary:16000,license:4000,shortage:5000,ot:10800,special:0 }, expense:{ social:875,provident:800,savings:5500,room:3500,food:7000,fuel:3000,shopping:3000,phone:2000,etf:3000,coop:2000,travel:5000 } }
        };

        // --- UI Components ---
        const fmt = (n) => "฿" + Number(n||0).toLocaleString("th-TH");
        const num = (v) => parseFloat(v) || 0;
        const sum = (obj) => Object.values(obj||{}).reduce((a,b)=>a+num(b),0);

        const Badge = ({ children, color }) => (
            <span style={{ background: color + "22", color, borderRadius:20, padding:"2px 10px", fontSize:11, fontWeight:600, border:`1px solid ${color}44` }}>
                {children}
            </span>
        );

        const SectionHead = ({ icon, title }) => (
            <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:14 }}>
                <span style={{ fontSize:18 }}>{icon}</span>
                <span style={{ fontFamily:"'Playfair Display', serif", fontSize:17, fontWeight:700, color:"#e2e8f0" }}>{title}</span>
            </div>
        );

        const AmountRow = ({ cat, value, onChange }) => {
            const [focused, setFocused] = useState(false);
            return (
                <div style={{
                    display:"flex", alignItems:"center", gap:10, padding:"8px 12px",
                    borderRadius:10, background: focused ? "#1e293b" : "transparent",
                    border: `1px solid ${focused ? cat.color+"66" : "transparent"}`,
                    transition:"all 0.15s", marginBottom:4
                }}>
                    <span style={{ fontSize:16, width:22, textAlign:"center" }}>{cat.icon}</span>
                    <span style={{ flex:1, fontSize:13, color:"#94a3b8" }}>{cat.label}</span>
                    <div style={{ position:"relative", display:"flex", alignItems:"center" }}>
                        <span style={{ position:"absolute", left:10, color: value ? cat.color : "#475569", fontSize:13, fontWeight:600 }}>฿</span>
                        <input
                            type="number" inputMode="decimal" value={value||""} placeholder="0"
                            onFocus={()=>setFocused(true)} onBlur={()=>setFocused(false)}
                            onChange={e=>onChange(num(e.target.value))}
                            style={{
                                width:90, padding:"6px 8px 6px 22px", borderRadius:8, border:"none",
                                background:"#0f172a", color: value ? "#f1f5f9" : "#475569",
                                fontSize:13, fontFamily:"'DM Mono', monospace", outline:"none", textAlign:"right"
                            }}
                        />
                    </div>
                </div>
            );
        };

        const PiePanel = ({ title, data, total, cats, color }) => {
            const chartData = cats
                .map(c => ({ name: c.label, value: num(data[c.id]), color: c.color, pct: total ? Math.round(num(data[c.id])/total*100) : 0 }))
                .filter(d => d.value > 0)
                .sort((a,b)=>b.value-a.value);

            if (!chartData.length) return <div style={{ textAlign:"center", padding:40, color:"#475569", fontSize:12 }}>ไม่มีข้อมูล</div>;

            return (
                <div style={{ width: '100%', height: 300 }}>
                    <div style={{ textAlign:"center", marginBottom:10 }}>
                        <div style={{ fontSize:20, fontWeight:700, color, fontFamily:"'DM Mono'" }}>{fmt(total)}</div>
                        <div style={{ fontSize:11, color:"#64748b" }}>รวม {title}</div>
                    </div>
                    <ResponsiveContainer width="100%" height="80%">
                        <PieChart>
                            <Pie data={chartData} cx="50%" cy="50%" innerRadius={50} outerRadius={80} paddingAngle={3} dataKey="value">
                                {chartData.map((entry,i) => <Cell key={i} fill={entry.color} stroke="none"/>)}
                            </Pie>
                            <Tooltip contentStyle={{background:'#1e293b', border:'none', borderRadius:'8px', fontSize:'12px'}} />
                        </PieChart>
                    </ResponsiveContainer>
                </div>
            );
        };

        // --- Main App ---
        function FinanceTracker() {
            // LOAD FROM LOCAL STORAGE
            const [data, setData] = useState(() => {
                const saved = localStorage.getItem("finance_pro_data");
                return saved ? JSON.parse(saved) : SEED_DATA;
            });
            const [note, setNote] = useState(() => {
                const saved = localStorage.getItem("finance_pro_notes");
                return saved ? JSON.parse(saved) : {};
            });

            const [year, setYear] = useState(new Date().getFullYear());
            const [month, setMonth] = useState(new Date().getMonth() + 1);
            const [tab, setTab] = useState("income");

            const key = `${year}-${month}`;
            const monthData = useMemo(() => data[key] || { income:{}, expense:{} }, [data, key]);

            // SAVE TO LOCAL STORAGE
            useEffect(() => { localStorage.setItem("finance_pro_data", JSON.stringify(data)); }, [data]);
            useEffect(() => { localStorage.setItem("finance_pro_notes", JSON.stringify(note)); }, [note]);

            const setAmount = (type, catId, val) => {
                setData(prev => ({
                    ...prev,
                    [key]: {
                        income: { ...(prev[key]?.income || {}) },
                        expense: { ...(prev[key]?.expense || {}) },
                        [type]: { ...(prev[key]?.[type] || {}), [catId]: val }
                    }
                }));
            };

            const totalIncome = sum(monthData.income);
            const totalExpense = sum(monthData.expense);
            const net = totalIncome - totalExpense;
            const savingRate = totalIncome ? Math.round((num(monthData.expense?.savings)||0) / totalIncome * 100) : 0;

            const copyLastMonth = () => {
                const prevM = month === 1 ? 12 : month - 1;
                const prevY = month === 1 ? year - 1 : year;
                if (data[`${prevY}-${prevM}`]) {
                    setData(prev => ({ ...prev, [key]: JSON.parse(JSON.stringify(prev[`${prevY}-${prevM}`])) }));
                }
            };

            return (
                <div style={{ minHeight:"100vh", paddingBottom:40 }}>
                    {/* Header */}
                    <div style={{ background:"linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%)", padding:"20px 20px 10px", borderBottom:"1px solid #1e293b" }}>
                        <div style={{ maxWidth:900, margin:"0 auto" }}>
                            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:20 }}>
                                <div>
                                    <div style={{ fontSize:10, color:"#6366f1", fontWeight:600, letterSpacing:1.5 }}>TRACKER</div>
                                    <h1 style={{ margin:0, fontSize:22, fontFamily:"'Playfair Display'", color:"#f8fafc" }}>Finance Pro</h1>
                                </div>
                                <div style={{ display:"flex", gap:8 }}>
                                    <button onClick={copyLastMonth} style={{ background:"#1e293b", color:"#94a3b8", border:"none", padding:"8px 12px", borderRadius:8, fontSize:11 }}>📋 Copy</button>
                                    <button onClick={() => {if(confirm('ล้างข้อมูลเดือนนี้?')) setData(prev=>({...prev, [key]:{income:{}, expense:{}}}))}} style={{ background:"#1c0f0f", color:"#f87171", border:"none", padding:"8px 12px", borderRadius:8, fontSize:11 }}>🗑️ Clear</button>
                                </div>
                            </div>

                            {/* Nav */}
                            <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:20 }}>
                                <select value={year} onChange={e=>setYear(+e.target.value)} style={{ background:"#1e293b", color:"#fff", border:"none", borderRadius:8, padding:5 }}>
                                    {YEARS.map(y=><option key={y} value={y}>{y}</option>)}
                                </select>
                                <div style={{ flex:1, display:"flex", gap:4, overflowX:"auto", paddingBottom:5 }}>
                                    {EN_MONTHS.map((m,i) => (
                                        <button key={i} onClick={()=>setMonth(i+1)} style={{
                                            padding:"4px 12px", borderRadius:15, fontSize:11, whiteSpace:"nowrap", border:"none",
                                            background: (i+1)===month ? "#6366f1" : "#0f172a",
                                            color: (i+1)===month ? "#fff" : "#475569"
                                        }}>{m.slice(0,3)}</button>
                                    ))}
                                </div>
                            </div>

                            {/* Tabs */}
                            <div style={{ display:"flex" }}>
                                {["income", "expense", "summary"].map(t => (
                                    <button key={t} onClick={()=>setTab(t)} style={{
                                        flex:1, padding:12, background: tab===t ? "#020817" : "transparent",
                                        color: tab===t ? "#6366f1" : "#64748b", border:"none", fontWeight:600, fontSize:13,
                                        borderBottom: tab===t ? "2px solid #6366f1" : "none", borderRadius:"8px 8px 0 0"
                                    }}>{t.toUpperCase()}</button>
                                ))}
                            </div>
                        </div>
                    </div>

                    {/* KPI Strip */}
                    <div style={{ background:"#0f172a", borderBottom:"1px solid #1e293b", overflowX:"auto" }}>
                        <div className="kpi-container" style={{ maxWidth:900, margin:"0 auto", padding:"15px 20px", display:"flex" }}>
                            {[
                                { label:"Income", val:totalIncome, color:"#10b981" },
                                { label:"Expense", val:totalExpense, color:"#f87171" },
                                { label:"Net", val:net, color: net>=0?"#10b981":"#f87171" },
                                { label:"Save %", val:null, color:"#a78bfa", extra:savingRate+"%" }
                            ].map((k,i)=>(
                                <div key={i} className="kpi-card" style={{ flex:1, padding:"0 15px", borderRight: i<3?"1px solid #1e293b":"none" }}>
                                    <div style={{ fontSize:10, color:"#475569" }}>{k.label}</div>
                                    <div style={{ fontSize:16, fontWeight:700, color:k.color, fontFamily:"'DM Mono'" }}>{k.extra || fmt(k.val)}</div>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* Main Content */}
                    <div style={{ maxWidth:900, margin:"0 auto", padding:20 }}>
                        {tab === "income" && (
                            <div className="grid-mobile" style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:20 }}>
                                <div style={{ background:"#0f172a", padding:20, borderRadius:16 }}>
                                    <SectionHead icon="💵" title="รายรับ" />
                                    {INCOME_CATS.map(c=>(<AmountRow key={c.id} cat={c} value={monthData.income[c.id]} onChange={v=>setAmount("income",c.id,v)} />))}
                                </div>
                                <div style={{ background:"#0f172a", padding:20, borderRadius:16 }}>
                                    <PiePanel title="Income" data={monthData.income} total={totalIncome} cats={INCOME_CATS} color="#10b981" />
                                </div>
                            </div>
                        )}

                        {tab === "expense" && (
                            <div className="grid-mobile" style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:20 }}>
                                <div style={{ background:"#0f172a", padding:20, borderRadius:16, maxHeight:500, overflowY:"auto" }}>
                                    <SectionHead icon="💸" title="รายจ่าย" />
                                    {EXPENSE_CATS.map(c=>(<AmountRow key={c.id} cat={c} value={monthData.expense[c.id]} onChange={v=>setAmount("expense",c.id,v)} />))}
                                </div>
                                <div style={{ background:"#0f172a", padding:20, borderRadius:16 }}>
                                    <PiePanel title="Expense" data={monthData.expense} total={totalExpense} cats={EXPENSE_CATS} color="#f87171" />
                                </div>
                            </div>
                        )}

                        {tab === "summary" && (
                            <div style={{ display:"flex", flexDirection:"column", gap:20 }}>
                                <div style={{ background: net>=0 ? "#052e16" : "#450a0a", padding:24, borderRadius:16, border:"1px solid rgba(255,255,255,0.1)" }}>
                                    <div style={{ fontSize:12, opacity:0.7 }}>NET BALANCE</div>
                                    <div style={{ fontSize:32, fontWeight:700, fontFamily:"'DM Mono'" }}>{net>=0?"+":""}{fmt(net)}</div>
                                    <div style={{ fontSize:12, marginTop:8 }}>{net>=0 ? "✅ ยอดเยี่ยม! เดือนนี้คุณคุมงบได้ดี" : "⚠️ ระวัง! รายจ่ายเกินรายรับ"}</div>
                                </div>
                                
                                <div style={{ background:"#0f172a", padding:20, borderRadius:16 }}>
                                    <SectionHead icon="📝" title="บันทึกเพิ่มเติม" />
                                    <textarea 
                                        value={note[key]||""} 
                                        onChange={e=>setNote(prev=>({...prev, [key]:e.target.value}))}
                                        placeholder="พิมพ์บันทึกของเดือนนี้ที่นี่..."
                                        style={{ width:"100%", background:"#020817", color:"#fff", border:"1px solid #334155", borderRadius:10, padding:12, height:100, fontFamily:"inherit" }}
                                    />
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<FinanceTracker />);
    </script>
</body>
</html>
